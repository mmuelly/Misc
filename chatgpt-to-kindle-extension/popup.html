<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .logo { font-size: 20px; }

    /* Collapsible settings */
    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 6px 0;
      margin-bottom: 4px;
      font-size: 12px;
      color: #aaa;
      user-select: none;
    }
    .settings-toggle:hover { color: #e0e0e0; }
    .settings-toggle .arrow { transition: transform 0.2s; }
    .settings-toggle .arrow.open { transform: rotate(90deg); }
    .settings-body { display: none; margin-bottom: 10px; }
    .settings-body.open { display: block; }

    label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }
    input[type="email"], input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 8px;
    }
    input:focus {
      outline: none;
      border-color: #e94560;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save {
      background: #0f3460;
      color: #e0e0e0;
      margin-bottom: 6px;
    }
    .btn-save:hover { background: #1a4a7a; }
    .btn-queue {
      background: #0f3460;
      color: #fff;
      margin-bottom: 6px;
    }
    .btn-queue:hover { background: #1a4a7a; }
    .btn-queue:disabled { background: #555; cursor: not-allowed; }
    .btn-send {
      background: #e94560;
      color: #fff;
    }
    .btn-send:hover { background: #c73650; }
    .btn-send:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .btn-clear {
      background: transparent;
      color: #e94560;
      border: 1px solid #e94560;
      font-size: 11px;
      padding: 5px 10px;
      width: auto;
      margin-left: auto;
    }
    .btn-clear:hover { background: rgba(233,69,96,0.15); }

    /* Queue section */
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 6px;
    }
    .queue-header h2 {
      font-size: 13px;
      color: #aaa;
    }
    .queue-list {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .queue-empty {
      font-size: 12px;
      color: #555;
      text-align: center;
      padding: 12px 0;
    }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #16213e;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .queue-item .num {
      color: #e94560;
      font-weight: 700;
      min-width: 18px;
    }
    .queue-item .title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-item .chars {
      color: #666;
      font-size: 10px;
      white-space: nowrap;
    }
    .queue-item .remove {
      background: none;
      border: none;
      color: #e94560;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
      opacity: 0.6;
    }
    .queue-item .remove:hover { opacity: 1; }

    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }
    .status-ok { color: #4ecca3; }
    .status-err { color: #e94560; }
    .status-info { color: #aaa; }
    .help {
      margin-top: 12px;
      font-size: 11px;
      color: #777;
      line-height: 1.5;
    }
    .help a { color: #e94560; text-decoration: none; }
  </style>
</head>
<body>
  <h1><span class="logo">&#128214;</span> Chat to Kindle</h1>

  <!-- Collapsible settings -->
  <div class="settings-toggle" id="settingsToggle">
    <span>Settings</span>
    <span class="arrow" id="settingsArrow">&#9654;</span>
  </div>
  <div class="settings-body" id="settingsBody">
    <label>Kindle Email Address</label>
    <input type="email" id="kindleEmail" placeholder="yourname@kindle.com">

    <label>Your Sender Email (approved in Kindle settings)</label>
    <input type="email" id="senderEmail" placeholder="you@gmail.com">

    <label>SMTP Server (e.g. smtp.gmail.com)</label>
    <input type="text" id="smtpHost" placeholder="smtp.gmail.com">

    <label>SMTP Port</label>
    <input type="text" id="smtpPort" placeholder="465">

    <label>SMTP Password / App Password</label>
    <input type="text" id="smtpPass" placeholder="your app password">

    <button class="btn btn-save" id="saveBtn">Save Settings</button>
  </div>

  <!-- Add to queue -->
  <button class="btn btn-queue" id="queueBtn">+ Add This Page to Queue</button>

  <!-- Queue list -->
  <div class="queue-header">
    <h2>Queue (<span id="queueCount">0</span>)</h2>
    <button class="btn btn-clear" id="clearBtn">Clear All</button>
  </div>
  <div class="queue-list" id="queueList">
    <div class="queue-empty">No conversations queued yet.</div>
  </div>

  <!-- Send stitched -->
  <button class="btn btn-send" id="sendBtn" disabled>Send Queue to Kindle</button>

  <div id="status"></div>

  <div class="help">
    <strong>Workflow:</strong> Open ChatGPT/Claude conversations and click
    <em>+ Add</em> for each. When ready, click <em>Send</em> to stitch them
    into one document with title pages and send to your Kindle.
  </div>

  <script src="popup.js"></script>
</body>
</html>
